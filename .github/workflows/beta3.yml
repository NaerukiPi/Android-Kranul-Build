name: "Build kernels beta 3"

on:
  workflow_dispatch:
    inputs:
      use_custom:
        description: 'Gunakan pengaturan kustom (abaikan repos.json)'
        required: false
        default: false
        type: boolean
      custom_kernel_repo:
        description: 'URL repo kernel (jika use_custom=true)'
        required: false
        default: ''
        type: string
      custom_kernel_branch:
        description: 'Branch kernel'
        required: false
        default: 'main'
        type: string
      custom_kernel_device:
        description: 'Nama device (untuk artifact)'
        required: false
        default: 'custom'
        type: string
      custom_defconfig:
        description: 'Nama defconfig (contoh: vendor/device_defconfig)'
        required: false
        default: ''
        type: string
      custom_ksu_url:
        description: 'URL custom KernelSU setup.sh (kosongkan untuk default)'
        required: false
        default: ''
        type: string
      custom_toolchain_url:
        description: 'URL langsung ke toolchain (zip/tar/tar.gz/rar)'
        required: false
        default: ''
        type: string
      custom_host_builder:
        description: 'Host Builder (contoh: MyBuilder)'
        required: false
        default: 'Klauz'
        type: string
      custom_localversion:
        description: 'Localversion suffix (contoh: -MyKernel)'
        required: false
        default: '-perf'
        type: string

env:
  OUT_DIR: "${{ github.workspace }}/out"

jobs:
  Set-repos:
    name: "Parse repos.json or custom input"
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
      builddate: ${{ steps.generate-builddate.outputs.builddate }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v5

      - name: "Generate Matrix (from files or custom input)"
        id: generate-matrix
        run: |
          if [ "${{ github.event.inputs.use_custom }}" == "true" ]; then
            echo "Menggunakan konfigurasi kustom..."
            jq -n \
              --arg repo "${{ github.event.inputs.custom_kernel_repo }}" \
              --arg branch "${{ github.event.inputs.custom_kernel_branch }}" \
              --arg device "${{ github.event.inputs.custom_kernel_device }}" \
              --arg defconfig "${{ github.event.inputs.custom_defconfig }}" \
              --arg ksu_url "${{ github.event.inputs.custom_ksu_url }}" \
              --arg tc_url "${{ github.event.inputs.custom_toolchain_url }}" \
              --arg host "${{ github.event.inputs.custom_host_builder }}" \
              --arg localver "${{ github.event.inputs.custom_localversion }}" \
              '{
                kernelSource: {
                  name: $device,
                  repo: $repo,
                  branch: $branch,
                  device: $device,
                  defconfig: $defconfig
                },
                kernelSU: {
                  withKernelSU: true,
                  customUrl: $ksu_url,
                  kernelSUFork: ""
                },
                ccache: true,
                AnyKernel3: {
                  use: true,
                  release: false,
                  repo: "https://github.com/YourOrg/AnyKernel3",
                  branch: "master"
                },
                toolchains: if $tc_url != "" then [{
                  name: "custom_toolchain",
                  url: $tc_url,
                  binPath: ["bin"]
                }] else [] end,
                params: {
                  ARCH: "arm64",
                  CC: "aarch64-linux-gnu-gcc",
                  externalCommand: {}
                },
                buildSettings: {
                  hostBuilder: $host,
                  localversion: $localver
                }
              }' | jq -s '.' > custom_repos.json
            echo "repos<<EOF" >> $GITHUB_OUTPUT
            cat custom_repos.json >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "Menggunakan repos/*.json"
            echo "repos<<EOF" >> $GITHUB_OUTPUT
            jq -s '[.[][]]' repos/repos*.json >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: "Set builddate"
        id: generate-builddate
        run: echo "builddate=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

  Build-Kernel:
    name: "Build kernel"
    runs-on: ubuntu-latest
    needs:
      - Set-repos
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}
    env:
      WORKSPACE: ${{ github.workspace }}
      builddate: "${{ needs.Set-repos.outputs.builddate }}"

      KERNEL_NAME: ${{ matrix.repos.kernelSource.name }}
      KERNEL_REPO: ${{ matrix.repos.kernelSource.repo }}
      KERNEL_BRANCH: ${{ matrix.repos.kernelSource.branch }}
      KERNEL_DEVICE: ${{ matrix.repos.kernelSource.device }}

      DEFCONFIG_NAME: ${{ matrix.repos.kernelSource.defconfig }}

      withKernelSU: ${{ matrix.repos.kernelSU.withKernelSU }}
      kernelSUFork: ${{ matrix.repos.kernelSU.kernelSUFork }}
      kernelSUCustomUrl: ${{ matrix.repos.kernelSU.customUrl }}
      ccache: ${{ matrix.repos.ccache }}
      useAnykernel: ${{ matrix.repos.AnyKernel3.use }}
      release: ${{ matrix.repos.AnyKernel3.release }}
      
      # Build settings tambahan
      HOST_BUILDER: ${{ matrix.repos.buildSettings.hostBuilder }}
      LOCALVERSION: ${{ matrix.repos.buildSettings.localversion }}
    steps:
      - name: "Install prerequisites"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev
          sudo apt-get install -y curl git ftp lftp wget libarchive-tools ccache python3 python3-dev python-is-python3
          sudo apt-get install -y zip unzip tar gzip bzip2 rar unrar

      - name: "Create cache key from repos"
        if: ${{ env.ccache == 'true' }}
        id: ccache_key
        run: |
          ccache -o compression=false -o cache_dir=$HOME/.ccache
          echo "CACHE_KEY=$(echo -n '${{ toJSON(matrix.repos) }}' | base64 -w 0 | cut -c -48)" >> $GITHUB_OUTPUT

      - name: "Cache ccache files"
        if: ${{ env.ccache == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ${{ env.OUT_DIR }}
          key: ccache-${{ env.KERNEL_NAME }}-${{ steps.ccache_key.outputs.CACHE_KEY }}-${{ env.builddate }}
          restore-keys: |
            ccache-${{ env.KERNEL_NAME }}-${{ steps.ccache_key.outputs.CACHE_KEY }}-${{ env.builddate }}

      - name: "Setup Anykernel3"
        env:
          params: "${{ toJSON(matrix.repos.AnyKernel3) }}"
        run: |
          ANYKERNEL_REPO=$(echo $params | jq -r ".repo")
          ANYKERNEL_BRANCH=$(echo $params | jq -r ".branch")
          git clone --recursive --depth=1 -j $(nproc) --branch $ANYKERNEL_BRANCH $ANYKERNEL_REPO AnyKernel3
          echo "Setup Anykernel3 => ($ANYKERNEL_REPO)"

      - name: "Clone kernel source => (${{ env.KERNEL_REPO }})"
        run: |
          git clone --recursive --depth=1 -j $(nproc) --branch $KERNEL_BRANCH $KERNEL_REPO $KERNEL_NAME
          echo "Clone kernel source => ($KERNEL_REPO)"

      - name: "Get toolchains"
        env:
          toolchains: "${{ toJSON(matrix.repos.toolchains) }}"
        run: |
          toolchains_num="$(echo $toolchains | jq 'length')"
          echo "There is $toolchains_num defined toolchains."
          for ((i=0;i<toolchains_num;i++)); do
            toolchain_name=$(echo $toolchains | jq -r ".[$i].name")
            toolchain_repo=$(echo $toolchains | jq -r ".[$i].repo")
            toolchain_branch=$(echo $toolchains | jq -r ".[$i].branch")
            toolchain_url=$(echo $toolchains | jq -r ".[$i].url")
            
            if [ -n "${toolchain_url:-}" ] && [ "$toolchain_url" != "null" ]; then
              wget "$toolchain_url"
              filename="${toolchain_url##*/}"
              mkdir -p $toolchain_name
              case "$filename" in
                *.zip)
                  unzip -d $toolchain_name "$filename"
                  ;;
                *.tar)
                  tar xvf "$filename" -C $toolchain_name
                  ;;
                *.tar.gz)
                  tar zxvf "$filename" -C $toolchain_name
                  ;;
                *.rar)
                  unrar x "$filename" $toolchain_name
                  ;;
                *)
                  echo "unknown file type: $filename"
                  ;;
              esac
              rm $filename
            elif [ -n "${toolchain_repo:-}" ] && [ "$toolchain_repo" != "null" ]; then
              git clone --recursive --depth=1 -j $(nproc) --branch $toolchain_branch $toolchain_repo $toolchain_name
              echo "Clone $toolchain_name => ($toolchain_repo)"
            else
              echo "No valid toolchain source for $toolchain_name"
              exit 1
            fi

            jq -r ".[$i].binPath[] | tostring" <<< "$toolchains" | while read -r bin_path; do
              echo "$WORKSPACE/$toolchain_name/$bin_path" >> $GITHUB_PATH
            done
          done

      - name: "Set args"
        id: generate-args
        env:
          params: "${{ toJSON(matrix.repos.params) }}"
          THREAD: $(nproc --all)
        run: |
          echo "PATH Variable: $PATH"

          ARCH=$(echo $params | jq -r ".ARCH")
          CC=$(echo $params | jq -r ".CC")

          args="-j${{ env.THREAD }}"
          if [ -n "${{ env.OUT_DIR }}" ]; then
            mkdir -p ${{ env.OUT_DIR }} && args="$args O=${{ env.OUT_DIR }}"
          fi
          if [ -n "$ARCH" ]; then
            args="$args ARCH=$ARCH"
          fi
          if [ -n "$CC" ]; then
            if [[ "$CC" == *"/"* ]]; then
              CC=${{ env.WORKSPACE }}/$CC
            fi
            if [ ${{ env.ccache }} = true ]; then
              args="$args CC=\"ccache $CC\""
            else
              args="$args CC=$CC"
            fi
          fi
          while read -r externalCommand; do
            key=$(echo "$externalCommand" | cut -d= -f1)
            value=$(echo "$externalCommand" | cut -d= -f2)
            if [[ "$value" == *"/"* ]]; then
              value="${{ env.WORKSPACE }}/$value"
            fi
            args="$args $key=$value"
          done < <(jq -r '.externalCommand | to_entries[] | "\(.key)=\(.value)"' <<< "$params")
        
          echo "$args"
          echo "ARCH=$ARCH" >> $GITHUB_OUTPUT
          echo "args=$args" >> $GITHUB_OUTPUT

      - name: "Update KernelSU"
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
        if: ${{ env.withKernelSU == 'true' }}
        run: |
          if [ -d "./KernelSU" ]; then
            rm -rf "./KernelSU"
          fi
          if [ -d "./drivers/kernelsu" ]; then
            rm -rf "./drivers/kernelsu"
          fi

          if [ -n "${{ env.kernelSUCustomUrl }}" ]; then
            echo "Using custom KernelSU URL: ${{ env.kernelSUCustomUrl }}"
            curl -LSs "${{ env.kernelSUCustomUrl }}" | bash -
          else
            case "${{ env.kernelSUFork }}" in
            "KernelSU")
              echo "Installing KernelSU..."
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
            ;;
            "KernelSU-Next")
              echo "Installing KernelSU Next..."
              curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -
            ;;
            "KernelSU-Next-SuSFS")
              echo "Installing KernelSU Next with SuSFS..."
              curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next-susfs/kernel/setup.sh" | bash -s next-susfs
            ;;
            *)
              echo "Installing default KernelSU version..."
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
            ;;
            esac
          fi

          # Tidak ada kprobes

      - name: "Export build host and localversion"
        run: |
          if [ -n "${{ env.HOST_BUILDER }}" ]; then
            echo "KBUILD_BUILD_HOST=${{ env.HOST_BUILDER }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ env.LOCALVERSION }}" ]; then
            echo "LOCALVERSION=${{ env.LOCALVERSION }}" >> $GITHUB_ENV
          fi

      - name: "Make defconfig"
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
          arch: ${{ steps.generate-args.outputs.ARCH }}
        run: |
          echo "PATH Variable: $PATH"
          echo "KBUILD_BUILD_HOST=${KBUILD_BUILD_HOST}"
          echo "LOCALVERSION=${LOCALVERSION}"
          make ${{ env.args }} ${{ env.DEFCONFIG_NAME }}

      - name: "Build kernel"
        working-directory: ${{ env.KERNEL_NAME }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: |
          echo "PATH Variable: $PATH"
          make ${{ env.args }}

      - name: "Upload Image"
        uses: actions/upload-artifact@v5
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: Image-${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}-${{ env.builddate }}
          path: ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload Image.gz"
        uses: actions/upload-artifact@v5
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: Image.gz-${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}-${{ env.builddate }}
          path: ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image.gz
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload dtb"
        uses: actions/upload-artifact@v5
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: dtb-${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}-${{ env.builddate }}
          path: ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/dtb
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload dtbo.img"
        uses: actions/upload-artifact@v5
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
        with:
          name: dtbo.img-${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}-${{ env.builddate }}
          path: ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/dtbo.img
          if-no-files-found: ignore
          retention-days: 7

      - name: "Pack AnyKernel3.zip"
        if: ${{ env.useAnykernel == 'true' }}
        env:
          arch: ${{ steps.generate-args.outputs.ARCH }}
          anykernel: "${{ env.WORKSPACE }}/${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}_${{ env.builddate }}"
        run: |
          ls -al

          if [ -e "${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image" ]; then
            cp -f ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image ./AnyKernel3/
          fi
          if [ -e "${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image.gz" ]; then
            cp -f ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/Image.gz ./AnyKernel3/
          fi
          if [ -e "${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/dtbo" ]; then
            cp -f ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/dtbo ./AnyKernel3/
          fi
          if [ -e "${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/dtbo.img" ]; then
            cp -f ${{ env.OUT_DIR }}/arch/${{ env.arch }}/boot/dtbo.img ./AnyKernel3/
          fi

          cd AnyKernel3/
          zip -q -r "${{ env.anykernel }}.zip" *

      - name: "Upload AnyKernel3 image => (${{ env.builddate }})"
        uses: actions/upload-artifact@v5
        if: ${{ env.useAnykernel == 'true' }}
        with:
          name: "${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}_${{ env.builddate }}"
          path: AnyKernel3/*

      - name: Create GitHub Release => (${{ env.builddate }})
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        if: ${{ env.useAnykernel == 'true' && env.release == 'true' }}
        with:
          tag_name: v${{ env.builddate }}.${{ github.run_number }}
          files: "${{ env.WORKSPACE }}/${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}_${{ env.builddate }}.zip"
          generate_release_notes: true
